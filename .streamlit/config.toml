[browser]
# Effective only where you control hosting. Streamlit Community Cloud overrides this to true.
gatherUsageStats = false
# Setting an address stops Streamlit from looking up this machine's public IP
# (an outbound request to checkip.amazonaws.com) when it starts headless.
serverAddress = "localhost"

[server]
maxUploadSize = 5
enableXsrfProtection = true
headless = true

[client]
showErrorDetails = "type"
toolbarMode = "minimal"

[logger]
level = "warning"

# ------------------------------------------------------------------ theme
# System font stack only: no remote fonts are loaded.
[theme]
font = "Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFont = "Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["2rem", "1.35rem", "1.1rem", "1rem", "0.95rem", "0.9rem"]
baseFontSize = 15
baseRadius = "0.65rem"
buttonRadius = "0.55rem"
metricValueFontSize = "1.7rem"
metricValueFontWeight = 650
showWidgetBorder = true
showSidebarBorder = true
# Categorical slots 1-3 validated for colour-vision deficiency (blue, orange, aqua).
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#6250d6"]

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F5"
textColor = "#16211F"
borderColor = "#DFE6E4"
linkColor = "#0F766E"
dataframeHeaderBackgroundColor = "#F3F6F5"

[theme.light.sidebar]
backgroundColor = "#F6F8F7"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E3E9E7"

[theme.dark]
primaryColor = "#2BB3A3"
backgroundColor = "#0E1413"
secondaryBackgroundColor = "#18201F"
textColor = "#E4ECEA"
borderColor = "#2A3533"
linkColor = "#5FD0C2"
dataframeHeaderBackgroundColor = "#18201F"

[theme.dark.sidebar]
backgroundColor = "#111918"
secondaryBackgroundColor = "#18201F"
borderColor = "#24302E"
